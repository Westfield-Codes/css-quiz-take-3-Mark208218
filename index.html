<!DOCTYPE html>
<html>
	<head>
    <title>CSS Quiz Last Chance</title>
    <link href="styles.css" rel="stylesheet">
	<style>
	/* ALL CHANGES GO HERE! */
	 .game {
		color:rgb(65, 194, 151);
	 }
	 
	 .score-board {
		color:darkturquoise;
		font-weight: bold;
	 }

     #score {
		color:red;
		font-size:25px;
		font-weight: bold;
	 }

	 .holes {
		width: 390px;
	 }

	 .hole {
		background:black;
		width: 100px;
		height: 100px;
		border-width: 2px;
		border-color: red;
		border-style: solid;
	 }
	 .game {
		width: 480px;
		height: 480px;
	 }

	 #startButton {
       margin:20px;
	 }

	 .mole {
		background:orange; 
		width: 80px;
		height: 80px;
		bottom: -100px;
		background-image: url(mole.png);
	 }
	</style>
	</head>
	<body>
		<!-- DON'T TOUCH ANYTHING BELOW HERE!!! -->
		<div id="demo">
			<video width="374" height="412" controls>
			  <source src="whackamole.mp4" type="video/mp4">
			  <source src="whackamole.ogg" type="video/ogg">
			</video>
		</div>
		<div class="game">
			<h1>Whack-a-Mole!</h1>
			<div class="score-board">
				<span>Score: </span><span id="score">2</span>
			</div>
			<div class="holes">
				<div class="hole"><div class="mole"></div></div>
				<div class="hole"><div class="mole"></div></div>
				<div class="hole"><div class="mole"></div></div>
				<div class="hole"><div class="mole"></div></div>
				<div class="hole"><div class="mole"></div></div>
				<div class="hole"><div class="mole"></div></div>
			</div>
			<button id="startButton">Start</button>
		</div>
		<script src="script.js"></script>
		<div id="quick-start-container"></div>
	</body>
</html>
